<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Design Your Core</title>
<style>
  html, body { height: 100%; margin: 0; background: #0A0B09; color: #EEF0E8; font: 16px/1.5 system-ui, sans-serif; }
  main { height: 100%; display: grid; place-content: center; gap: 16px; padding: 24px; text-align: center; }
  h1 { margin: 0; font: 400 32px/1.15 Georgia, serif; }
  p { margin: 0; color: #A3A89B; max-width: 40ch; }
  button { justify-self: center; min-height: 44px; padding: 0 24px; border: 0; border-radius: 999px; background: #C8F23A; color: #0A0B09; font: 600 16px system-ui, sans-serif; cursor: pointer; }
  button:focus-visible { outline: 2px solid #EEF0E8; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Sin conexión</h1>
  <p>Design Your Core necesita internet para traer tus datos de tu cuenta. Revisa tu conexión y vuelve a intentarlo.</p>
  <button type="button" id="retry">Reintentar</button>
</main>
<script>
  const url = new URLSearchParams(location.search).get('url') || 'https://designyourcorepanel.nvcorx.com';
  document.getElementById('retry').addEventListener('click', () => { if (/^https:\/\//.test(url)) location.href = url; });
</script>
</body>
</html>
