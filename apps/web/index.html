<!doctype html>
<html lang="es" data-theme="dark" data-style="editorial" data-font="clasica" data-palette="lima">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Tu bienestar en seis pilares, en pasos pequeños." />
    <meta name="theme-color" content="#0A0B09" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Design Your Core</title>
    <script>
      // Aplica el tema, el estilo, la tipografía y la paleta guardados antes de pintar,
      // para evitar un destello. Los valores por defecto son los data-* de <html>
      // (ver src/app/theme.ts, style.ts, font.ts y palette.ts). «system» quita el tema
      // para que decida prefers-color-scheme.
      try {
        var t = localStorage.getItem('dyc.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        else if (t === 'system') delete document.documentElement.dataset.theme;
        var s = localStorage.getItem('dyc.style');
        if (['editorial', 'minimal', 'glass', 'suave'].indexOf(s) >= 0) document.documentElement.dataset.style = s;
        var f = localStorage.getItem('dyc.font');
        if (['clasica', 'moderna', 'geometrica', 'elegante', 'amable'].indexOf(f) >= 0) document.documentElement.dataset.font = f;
        var p = localStorage.getItem('dyc.palette');
        if (['lima', 'azul', 'salvia', 'terracota', 'lavanda', 'grafito'].indexOf(p) >= 0) document.documentElement.dataset.palette = p;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
